[package]
name = "ausbildungs-cockpit"
version = "0.1.0"
description = "Ausbildungs-Cockpit – zweite Oberfläche auf den Obsidian-Lernvault"
authors = ["Ausbildungs-Cockpit"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "ausbildungs_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# main.rs enthält keine Tests; der leere Test-Runner wird von Windows Defender
# fälschlich blockiert (os error 225). Alle Tests liegen in der Bibliothek und in tests/.
[[bin]]
name = "ausbildungs-cockpit"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
include_dir = "0.7.4"
# KI-Schlüssel im Windows-Anmeldeinformationsspeicher (nie in einer Datei); 3.x passt zu rust-version 1.80
keyring = { version = "3.6.3", features = ["windows-native"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
regex = "1.13.1"
# Anthropic Messages API (M2). 0.12 statt 0.13: passt zu rust-version 1.80; TLS über Windows (schannel)
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "default-tls"] }
# Versionsvergleich für Updates (steckt über tauri schon im Cargo.lock)
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
# 0.10.x: steckt über tauri schon im Cargo.lock und passt zu rust-version 1.80 (0.11 braucht 1.88)
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Updates über GitHub Releases. 2.12: letzte Version für rust-version 1.80 (2.13 braucht 1.90);
# TLS über Windows wie reqwest oben, ohne zip (nur für alte v1-Pakete nötig)
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
# Temporärdateien für atomares Schreiben in den Vault (write.rs)
tempfile = "3.27.0"
thiserror = "2.0.21"

# ReplaceFileW zum atomaren Ersetzen beim Speichern (steckt über tempfile schon im Cargo.lock)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
